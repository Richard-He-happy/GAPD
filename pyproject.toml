[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gapd"
version = "0.1.0"
description = "Privacy-preserving public demo of genetic-algorithm-inspired peptide sequence search"
requires-python = ">=3.10"
authors = [
  { name = "GAPD Authors" }
]
dependencies = [
  "PyYAML>=6.0"
]

[project.scripts]
gapd = "gapd.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gapd*"]
